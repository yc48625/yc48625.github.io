  <text x="92" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#1c2830">1AGW, 1BL6</text>
  <text x="92" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">...6E4F</text>
  <text x="92" y="141" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">...8H6T, 8H7F</text>
  <text x="92" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">Non-covalent binders</text>
  <text x="92" y="223" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">with PDBs</text>

  <text x="92" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#1c2830">1A0H, 1A0L</text>
  <text x="92" y="314" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">...5P9J</text>
  <text x="92" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">...9LPR, 9XIA</text>
  <text x="92" y="392" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">Covalent binders</text>
  <text x="92" y="418" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">with PDBs</text>

