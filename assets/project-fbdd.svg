  <text x="337" y="217" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">Non-covalent ligands</text>
  <text x="337" y="391" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">Covalent ligands</text>
  <text x="623" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">Interaction-driven</text>
  <text x="623" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">non-covalent fragments</text>
  <text x="623" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">Distance-derived</text>
  <text x="623" y="402" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">covalent fragments</text>
  <text x="820" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">Non-covalent</text>
  <text x="820" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">recombined library</text>
  <text x="820" y="317" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1c2830">Covalent</text>
  <text x="820" y="351" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1c2830">recombined library</text>
